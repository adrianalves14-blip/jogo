<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FC 25: Card Evolution & Meta Simulator</title>
    <style>
        :root {
            --fc-gold: linear-gradient(135deg, #f5d061 0%, #e3a619 100%);
            --fc-special: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            --fc-evo: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --bg-dark: #0a0a0c;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container { max-width: 900px; text-align: center; }

        /* Estilo da Carta FC 25 */
        .card {
            width: 180px;
            height: 260px;
            background: var(--fc-gold);
            border-radius: 10px;
            position: relative;
            color: #333;
            display: inline-block;
            margin: 10px;
            transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .card.special { background: var(--fc-special); color: white; }
        .card.evo { background: var(--fc-evo); color: white; border: 2px solid #fff; animation: glow 2s infinite; }

        @keyframes glow {
            0% { box-shadow: 0 0 5px #4facfe; }
            50% { box-shadow: 0 0 20px #00f2fe; }
            100% { box-shadow: 0 0 5px #4facfe; }
        }

        .rating { position: absolute; top: 15px; left: 15px; font-size: 28px; font-weight: bold; }
        .position { position: absolute; top: 45px; left: 15px; font-size: 14px; font-weight: bold; }
        .name { position: absolute; top: 150px; width: 100%; text-align: center; font-weight: bold; text-transform: uppercase; }
        .role { position: absolute; top: 175px; width: 100%; text-align: center; font-size: 11px; background: rgba(0,0,0,0.1); padding: 2px 0; }
        .playstyle-plus { position: absolute; top: 200px; width: 100%; text-align: center; font-size: 10px; color: #d4af37; font-weight: bold; }

        /* Interface */
        .controls { margin-top: 30px; background: #1a1a1d; padding: 20px; border-radius: 15px; width: 100%; }
        button {
            background: #fff; border: none; padding: 10px 20px; font-weight: bold;
            cursor: pointer; border-radius: 5px; margin: 5px; transition: 0.2s;
        }
        button:hover { background: #00f2fe; color: white; }
        .stats-panel { margin-top: 10px; font-size: 14px; color: #aaa; }
        
        #squad { min-height: 280px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>FC 25 <span style="color: #00f2fe;">Evolutions</span></h1>
        <p>Monte seu Dream Team e aplique Funções Plus (+)</p>

        <div id="squad">
            </div>

        <div class="controls">
            <button onclick="openPack()">Abrir Pacote (Gaste 500 Coins)</button>
            <button onclick="applyEvo()" style="background: #00f2fe; color: black;">Aplicar Evolução Meta</button>
            <div class="stats-panel">
                Coins: <span id="coins">2000</span> | Cartas no Clube: <span id="cardCount">0</span>
            </div>
            <p style="font-size: 12px; color: #666;">Dica: Cartas com Função Plus (+) dominam o meio-campo no FC 25.</p>
        </div>
    </div>

    <script>
        let coins = 2000;
        let myCards = [];
        const names = ["Vini Jr", "Mbappé", "Bellingham", "Putellas", "Rodri", "Salah", "Hansen", "Musiala"];
        const roles = ["Avançado", "Falso 9", "Fixo", "Box-to-Box", "Meia Ala", "Pivô"];
        const playstyles = ["Finesse Shot+", "Anticipate+", "Rapid+", "Technical+", "Whipped Pass+"];

        function openPack() {
            if (coins < 500) {
                alert("Sem coins suficientes! Jogue o Division Rivals.");
                return;
            }

            coins -= 500;
            document.getElementById('coins').innerText = coins;

            const isSpecial = Math.random() > 0.8;
            const card = {
                id: Date.now(),
                name: names[Math.floor(Math.random() * names.length)],
                rating: Math.floor(Math.random() * (91 - 82) + 82),
                role: roles[Math.floor(Math.random() * roles.length)],
                psPlus: Math.random() > 0.5 ? playstyles[Math.floor(Math.random() * playstyles.length)] : "Nenhum",
                type: isSpecial ? "special" : "gold",
                hasPlus: Math.random() > 0.7
            };

            myCards.push(card);
            renderCards();
        }

        function applyEvo() {
            if (myCards.length === 0) return;
            
            // Simula o sistema de Evo: Pega a última carta e melhora
            let lastCard = myCards[myCards.length - 1];
            if(lastCard.type === "evo") {
                alert("Esta carta já atingiu o nível máximo de Evolução!");
                return;
            }

            lastCard.rating += 3;
            lastCard.type = "evo";
            lastCard.hasPlus = true; // Ganha Função Plus+
            lastCard.psPlus = playstyles[Math.floor(Math.random() * playstyles.length)];
            
            renderCards();
            alert(`Evolução concluída! ${lastCard.name} agora é Meta!`);
        }

        function renderCards() {
            const squad = document.getElementById('squad');
            const cardCount = document.getElementById('cardCount');
            squad.innerHTML = '';
            cardCount.innerText = myCards.length;

            myCards.slice(-4).forEach(card => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.type}`;
                
                cardEl.innerHTML = `
                    <div class="rating">${card.rating}</div>
                    <div class="position">ATA</div>
                    <div class="name">${card.name}</div>
                    <div class="role">${card.role}${card.hasPlus ? ' <b>(+)</b>' : ''}</div>
                    <div class="playstyle-plus">${card.psPlus !== 'Nenhum' ? '✦ ' + card.psPlus : ''}</div>
                `;
                squad.appendChild(cardEl);
            });
        }
    </script>
</body>
</html>
