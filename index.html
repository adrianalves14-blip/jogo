<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>eFootball Mini-Sim: Dream Team</title>
    <style>
        body { background-color: #1a1a2e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        #game-container { position: relative; margin-top: 20px; border: 4px solid #fbd400; border-radius: 10px; }
        canvas { background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%); cursor: crosshair; }
        .ui-panel { background: rgba(0, 0, 50, 0.8); padding: 15px; border-radius: 0 0 10px 10px; width: 800px; display: flex; justify-content: space-between; }
        .stats { color: #fbd400; font-weight: bold; }
        .info-box { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 5px; font-size: 12px; }
        h1 { margin-bottom: 5px; color: #fbd400; text-transform: uppercase; }
        button { background: #fbd400; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        button:hover { background: #fff; }
    </style>
</head>
<body>

    <h1>eFootball: Dream Team Sim</h1>
    
    <div id="game-container">
        <div class="info-box">Física Unreal Engine: Ativa | IA de Marcação: Automática</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <div class="ui-panel">
        <div>
            <div>Moedas eFootball: <span id="coins" class="stats">100</span></div>
            <div>Gols: <span id="score" class="stats">0</span></div>
        </div>
        <div id="msg">Clique no gol para chutar!</div>
        <button onclick="resetGame()">Próxima Rodada (Gacha)</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const coinsEl = document.getElementById('coins');
        const msgEl = document.getElementById('msg');

        let score = 0;
        let coins = 100;
        let ball = { x: 400, y: 350, r: 15, targetX: 400, targetY: 350, shooting: false };
        let keeper = { x: 400, y: 120, w: 60, h: 20, speed: 3 };
        let goal = { x: 200, y: 80, w: 400, h: 100 };

        function drawField() {
            // Gramado
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 200, 800, 200);
            
            // Trave
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 8;
            ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
            
            // Marca do pênalti
            ctx.beginPath();
            ctx.arc(400, 350, 3, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
        }

        function drawKeeper() {
            ctx.fillStyle = '#ff4b2b';
            ctx.fillRect(keeper.x - keeper.w/2, keeper.y, keeper.w, keeper.h);
            // IA de marcação automática (segue a bola lateralmente)
            if(!ball.shooting) {
                keeper.x += keeper.speed;
                if(keeper.x > 550 || keeper.x < 250) keeper.speed *= -1;
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.strokeStyle = "black";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawField();
            drawKeeper();
            drawBall();

            if (ball.shooting) {
                // Simulação da Física de Bola Fluida
                ball.x += (ball.targetX - ball.x) * 0.1;
                ball.y += (ball.targetY - ball.y) * 0.1;
                ball.r *= 0.98; // Efeito de profundidade

                // Colisão com Goleiro (IA Automática)
                if (Math.abs(ball.x - keeper.x) < 40 && Math.abs(ball.y - keeper.y) < 20) {
                    msgEl.innerText = "IA Automática defendeu!";
                    resetBall();
                }

                // Verificação de Gol
                if (ball.y <= goal.y + 10) {
                    if (ball.x > goal.x && ball.x < goal.x + goal.w) {
                        score++;
                        coins += 50;
                        scoreEl.innerText = score;
                        coinsEl.innerText = coins;
                        msgEl.innerText = "GOL! +50 Moedas (Evento Semanal)";
                    } else {
                        msgEl.innerText = "Fora! A física da bola é realista.";
                    }
                    resetBall();
                }
            }
            requestAnimationFrame(update);
        }

        canvas.addEventListener('mousedown', (e) => {
            if (ball.shooting) return;
            const rect = canvas.getBoundingClientRect();
            ball.targetX = e.clientX - rect.left;
            ball.targetY = e.clientY - rect.top;
            ball.shooting = true;
        });

        function resetBall() {
            setTimeout(() => {
                ball.x = 400;
                ball.y = 350;
                ball.r = 15;
                ball.shooting = false;
            }, 1000);
        }

        function resetGame() {
            if(coins >= 100) {
                coins -= 100;
                coinsEl.innerText = coins;
                msgEl.innerText = "Contratando lenda via Gacha...";
                alert("Você tirou um jogador Épico! Atributos de chute aumentados.");
            } else {
                alert("Sem moedas. Complete eventos semanais!");
            }
        }

        update();
    </script>
</body>
</html>
