<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Zumbi Shooter Simples</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        canvas { display: block; background: #2c3e50; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">Pontos: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let gameActive = true;

        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 15,
            color: '#3498db'
        };

        const projectiles = [];
        const enemies = [];

        // Capturar posição do mouse
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Atirar ao clicar
        window.addEventListener('mousedown', () => {
            if(!gameActive) return;
            
            const angle = Math.atan2(mouseY - player.y, mouseX - player.x);
            projectiles.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 8,
                vy: Math.sin(angle) * 8
            });
        });

        function spawnEnemy() {
            const radius = 15;
            let x, y;

            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? 0 - radius : canvas.width + radius;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? 0 - radius : canvas.height + radius;
            }

            const angle = Math.atan2(player.y - y, player.x - x);
            enemies.push({ x, y, vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2 });
        }

        setInterval(() => { if(gameActive) spawnEnemy(); }, 1000);

        function update() {
            if (!gameActive) return;

            // Mover jogador em direção ao mouse (suave)
            player.x += (mouseX - player.x) * 0.05;
            player.y += (mouseY - player.y) * 0.05;

            // Atualizar Projéteis
            projectiles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                    projectiles.splice(index, 1);
                }
            });

            // Atualizar Inimigos
            enemies.forEach((en, enIdx) => {
                en.x += en.vx;
                en.y += en.vy;

                // Colisão Inimigo vs Jogador
                const distPlayer = Math.hypot(player.x - en.x, player.y - en.y);
                if (distPlayer < 25) {
                    gameActive = false;
                    alert("Fim de Jogo! Pontuação: " + score);
                    location.reload();
                }

                // Colisão Inimigo vs Projétil
                projectiles.forEach((p, pIdx) => {
                    const dist = Math.hypot(p.x - en.x, p.y - en.y);
                    if (dist < 20) {
                        enemies.splice(enIdx, 1);
                        projectiles.splice(pIdx, 1);
                        score += 10;
                        scoreElement.innerText = score;
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Jogador
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - 15, player.y - 15, 30, 30);

            // Desenhar Projéteis
            ctx.fillStyle = '#f1c40f';
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Desenhar Inimigos
            ctx.fillStyle = '#2ecc71';
            enemies.forEach(en => {
                ctx.fillRect(en.x - 15, en.y - 15, 30, 30);
            });

            requestAnimationFrame(() => {
                update();
                draw();
            });
        }

        draw();
    </script>
</body>
</html>
